<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Yelkoru</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg:#F7F6F2; --fg:#1F2A22; --soft:#5B665E; --accent:#2E6B3F; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121513; --fg:#ECEFEA; --soft:#A3ADA6; --accent:#6FCF8A; } }
  html, body { height:100%; margin:0; }
  body { display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg);
         font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif; text-align:center; padding:0 16px; }
  main { display:flex; flex-direction:column; align-items:center; gap:18px; }
  img { width:72px; height:72px; }
  h1 { margin:0; font-size:clamp(2rem, 7vw, 3rem); font-weight:600; letter-spacing:-0.02em; }
  p { margin:0; font-size:1.1rem; color:var(--soft); }
</style>
</head>
<body>
<main>
  <img src="/favicon.svg" alt="">
  <h1>Yelkoru</h1>
  <p>Sayfa yapım aşamasındadır.</p>
</main>
</body>
</html>
